<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="The six checks every bill gets">
<title>The six checks every bill gets</title>
<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9F1DC"/><stop offset="1" stop-color="#E6D7B0"/></linearGradient>
<filter id="s" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="7" dy="8" stdDeviation="8" flood-color="#8A6C38" flood-opacity=".3"/><feDropShadow dx="-6" dy="-6" stdDeviation="7" flood-color="#FFFCF0" flood-opacity=".9"/></filter>
<style>.t{font-family:Manrope,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.l{font-family:"Chakra Petch",Manrope,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:.14em}.m{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}</style></defs>
<rect width="1280" height="420" rx="28" fill="#F1E6C8"/>
<text x="40" y="44" class="l" font-size="15" fill="#4A3F2E">EVERY BILL GETS SIX CHECKS</text>
<g filter="url(#s)"><rect x="40" y="70" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="64" y="112" class="l" font-size="16" fill="#B3A47E">01</text>
<rect x="340" y="92" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="356" cy="105" r="5" fill="#1E7656"/>
<text x="387" y="110" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="64" y="150" class="t" font-size="24" font-weight="800" fill="#2A2217">Adds up</text>
<text x="64" y="178" class="t" font-size="16" font-weight="600" fill="#6A5C44">Line items add up to the total</text>
<text x="64" y="202" class="m" font-size="12" fill="#A8361F">fails as ARITHMETIC_MISMATCH</text>
<g filter="url(#s)"><rect x="446" y="70" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="470" y="112" class="l" font-size="16" fill="#B3A47E">02</text>
<rect x="746" y="92" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="762" cy="105" r="5" fill="#1E7656"/>
<text x="793" y="110" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="470" y="150" class="t" font-size="24" font-weight="800" fill="#2A2217">Words match</text>
<text x="470" y="178" class="t" font-size="16" font-weight="600" fill="#6A5C44">Amount in words matches the figure</text>
<text x="470" y="202" class="m" font-size="12" fill="#A8361F">fails as WORDS_FIGURES_MISMATCH</text>
<g filter="url(#s)"><rect x="852" y="70" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="876" y="112" class="l" font-size="16" fill="#B3A47E">03</text>
<rect x="1152" y="92" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="1168" cy="105" r="5" fill="#1E7656"/>
<text x="1199" y="110" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="876" y="150" class="t" font-size="24" font-weight="800" fill="#2A2217">Not twice</text>
<text x="876" y="178" class="t" font-size="16" font-weight="600" fill="#6A5C44">Not already paid, not twice in the batch</text>
<text x="876" y="202" class="m" font-size="12" fill="#A8361F">fails as POSSIBLE_DUPLICATE</text>
<g filter="url(#s)"><rect x="40" y="240" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="64" y="282" class="l" font-size="16" fill="#B3A47E">04</text>
<rect x="340" y="262" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="356" cy="275" r="5" fill="#1E7656"/>
<text x="387" y="280" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="64" y="320" class="t" font-size="24" font-weight="800" fill="#2A2217">Known vendor</text>
<text x="64" y="348" class="t" font-size="16" font-weight="600" fill="#6A5C44">Vendor is in your approved list</text>
<text x="64" y="372" class="m" font-size="12" fill="#A8361F">fails as VENDOR_UNRESOLVED</text>
<g filter="url(#s)"><rect x="446" y="240" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="470" y="282" class="l" font-size="16" fill="#B3A47E">05</text>
<rect x="746" y="262" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="762" cy="275" r="5" fill="#1E7656"/>
<text x="793" y="280" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="470" y="320" class="t" font-size="24" font-weight="800" fill="#2A2217">Same bank account</text>
<text x="470" y="348" class="t" font-size="16" font-weight="600" fill="#6A5C44">Pays only the saved account</text>
<text x="470" y="372" class="m" font-size="12" fill="#A8361F">fails as CHANGED_BENEFICIARY</text>
<g filter="url(#s)"><rect x="852" y="240" width="388" height="148" rx="20" fill="url(#r)"/></g>
<text x="876" y="282" class="l" font-size="16" fill="#B3A47E">06</text>
<rect x="1152" y="262" width="66" height="26" rx="13" fill="#3CCB8E" fill-opacity=".22"/><circle cx="1168" cy="275" r="5" fill="#1E7656"/>
<text x="1199" y="280" text-anchor="middle" class="l" font-size="11" fill="#1E7656">PASS</text>
<text x="876" y="320" class="t" font-size="24" font-weight="800" fill="#2A2217">Name confirmed</text>
<text x="876" y="348" class="t" font-size="16" font-weight="600" fill="#6A5C44">Cashfree Secure ID confirms the holder</text>
<text x="876" y="372" class="m" font-size="12" fill="#A8361F">fails as ACCOUNT_NAME_MISMATCH</text>
</svg>