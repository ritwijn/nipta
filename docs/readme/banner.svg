<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Nipta: pay the right bill, to the right person">
  <title>Nipta: pay the right bill, to the right person</title>
  <defs>
    <linearGradient id="raised" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9F1DC"/><stop offset="1" stop-color="#E6D7B0"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8C66"/><stop offset="1" stop-color="#1E7656"/></linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="10" dy="12" stdDeviation="12" flood-color="#8A6C38" flood-opacity=".32"/><feDropShadow dx="-8" dy="-8" stdDeviation="10" flood-color="#FFFCF0" flood-opacity=".9"/></filter>
    <style>
      .t{font-family:Manrope,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .lab{font-family:"Chakra Petch",Manrope,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.14em;font-weight:700}
      .dot{animation:pulse 2.4s ease-in-out infinite}.d2{animation-delay:.8s}.d3{animation-delay:1.6s}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.dot{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#F1E6C8"/>
  <!-- logo key and name -->
  <rect x="64" y="76" width="96" height="96" rx="22" fill="#145A40"/>
  <rect x="64" y="70" width="96" height="96" rx="22" fill="url(#key)"/>
  <text x="112" y="137" text-anchor="middle" class="t" font-size="56" font-weight="800" fill="#F4FFF8">N</text>
  <text x="186" y="140" class="t" font-size="72" font-weight="800" fill="#2A2217" letter-spacing="-2">Nipta</text>
  <text x="66" y="226" class="t" font-size="34" font-weight="700" fill="#2A2217">Pay the right bill, to the right person.</text>
  <text x="66" y="266" class="t" font-size="20" font-weight="600" fill="#6A5C44">Reads supplier bills in Tamil, Hindi and English,</text>
  <text x="66" y="294" class="t" font-size="20" font-weight="600" fill="#6A5C44">checks each one six ways, and pays only the bill</text>
  <text x="66" y="322" class="t" font-size="20" font-weight="600" fill="#6A5C44">you approve, to the account you saved.</text>
  <text x="66" y="364" class="lab" font-size="14" fill="#4A3F2E">CASHFREE × SARVAM AI BUILDATHON · BENGALURU 2026</text>
  <!-- today card -->
  <g filter="url(#soft)"><rect x="780" y="56" width="440" height="288" rx="22" fill="url(#raised)"/></g>
  <text x="808" y="96" class="lab" font-size="13" fill="#4A3F2E">TODAY · 6 BILLS</text>
  <g class="t">
    <circle class="dot" cx="816" cy="133" r="7" fill="#3CCB8E"/><text x="834" y="139" font-size="17" font-weight="700" fill="#2A2217">Pay Coimbatore Packing</text><text x="1192" y="139" text-anchor="end" font-size="17" font-weight="700" fill="#2A2217">₹3,200</text>
    <line x1="808" y1="160" x2="1192" y2="160" stroke="#8A6C38" stroke-opacity=".2"/>
    <circle class="dot d2" cx="816" cy="187" r="7" fill="#F0644A"/><text x="834" y="193" font-size="17" font-weight="700" fill="#2A2217">Don't pay Tamil Tools</text><text x="1192" y="193" text-anchor="end" font-size="17" font-weight="700" fill="#2A2217">₹4,500</text>
    <text x="834" y="214" font-size="13" font-weight="600" fill="#A8361F">Items add up to ₹4,300</text>
    <line x1="808" y1="232" x2="1192" y2="232" stroke="#8A6C38" stroke-opacity=".2"/>
    <circle class="dot d2" cx="816" cy="259" r="7" fill="#F0644A"/><text x="834" y="265" font-size="17" font-weight="700" fill="#2A2217">Don't pay Eastern Hardware</text><text x="1192" y="265" text-anchor="end" font-size="17" font-weight="700" fill="#2A2217">₹6,000</text>
    <text x="834" y="286" font-size="13" font-weight="600" fill="#A8361F">Bank account differs from the saved one</text>
    <line x1="808" y1="304" x2="1192" y2="304" stroke="#8A6C38" stroke-opacity=".2"/>
    <circle class="dot d3" cx="816" cy="326" r="7" fill="#EDA62F"/><text x="834" y="332" font-size="17" font-weight="700" fill="#2A2217">Check Kaveri Fasteners</text><text x="1192" y="332" text-anchor="end" font-size="17" font-weight="700" fill="#2A2217">₹8,200</text>
  </g>
</svg>
