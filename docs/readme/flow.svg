<line x1="630" y1="165.0" x2="646" y2="165.0" stroke="#B3A47E" stroke-width="3" marker-end="url(#a)"/>
<line x1="936" y1="165.0" x2="952" y2="165.0" stroke="#B3A47E" stroke-width="3" marker-end="url(#a)"/>
<path d="M1098.0 264 V300 H333.0 V322" fill="none" stroke="#B3A47E" stroke-width="3" marker-end="url(#a)"/>
<line x1="477" y1="425.0" x2="493" y2="425.0" stroke="#B3A47E" stroke-width="3" marker-end="url(#a)"/>
<line x1="783" y1="425.0" x2="799" y2="425.0" stroke="#B3A47E" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="40" y="70" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="40" y="70" width="8" height="190" rx="4" fill="#8A5A08"/>
<text x="66" y="110" class="l" font-size="15" fill="#B3A47E">01</text>
<rect x="245.39999999999998" y="90" width="56.599999999999994" height="28" rx="14" fill="#8A5A08"/>
<text x="273.7" y="109" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">YOU</text>
<text x="66" y="162" class="t" font-size="24" font-weight="800" fill="#2A2217">Add the bills</text>
<text x="66" y="198" class="t" font-size="16" font-weight="600" fill="#6A5C44">PDF or photo, Tamil,</text>
<text x="66" y="222" class="t" font-size="16" font-weight="600" fill="#6A5C44">Hindi or English</text>
<g filter="url(#s)"><rect x="346" y="70" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="346" y="70" width="8" height="190" rx="4" fill="#34449F"/>
<text x="372" y="110" class="l" font-size="15" fill="#B3A47E">02</text>
<rect x="490.2" y="90" width="117.8" height="28" rx="14" fill="#34449F"/>
<text x="549.1" y="109" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">SARVAM AI</text>
<text x="372" y="162" class="t" font-size="24" font-weight="800" fill="#2A2217">Read each bill</text>
<text x="372" y="198" class="t" font-size="16" font-weight="600" fill="#6A5C44">Document AI pulls out</text>
<text x="372" y="222" class="t" font-size="16" font-weight="600" fill="#6A5C44">vendor, items, totals</text>
