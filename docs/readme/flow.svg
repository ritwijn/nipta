<rect x="652" y="70" width="8" height="190" rx="4" fill="#2A2217"/>
<text x="678" y="110" class="l" font-size="15" fill="#B3A47E">03</text>
<rect x="786.0" y="90" width="128.0" height="28" rx="14" fill="#2A2217"/>
<text x="850.0" y="109" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">NIPTA CODE</text>
<text x="678" y="162" class="t" font-size="24" font-weight="800" fill="#2A2217">Six checks</text>
<text x="678" y="198" class="t" font-size="16" font-weight="600" fill="#6A5C44">Plain code, integer paise.</text>
<text x="678" y="222" class="t" font-size="16" font-weight="600" fill="#6A5C44">No model decides money</text>
<g filter="url(#s)"><rect x="958" y="70" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="958" y="70" width="8" height="190" rx="4" fill="#34449F"/>
<text x="984" y="110" class="l" font-size="15" fill="#B3A47E">04</text>
<rect x="1102.2" y="90" width="117.8" height="28" rx="14" fill="#34449F"/>
<text x="1161.1" y="109" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">SARVAM AI</text>
<text x="984" y="162" class="t" font-size="24" font-weight="800" fill="#2A2217">Explain and answer</text>
<text x="984" y="198" class="t" font-size="16" font-weight="600" fill="#6A5C44">Kannada, Hindi, English.</text>
<text x="984" y="222" class="t" font-size="16" font-weight="600" fill="#6A5C44">Saaras hears, Bulbul speaks</text>
<g filter="url(#s)"><rect x="193" y="330" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="193" y="330" width="8" height="190" rx="4" fill="#8A5A08"/>
<text x="219" y="370" class="l" font-size="15" fill="#B3A47E">05</text>
<rect x="398.4" y="350" width="56.599999999999994" height="28" rx="14" fill="#8A5A08"/>
<text x="426.7" y="369" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">YOU</text>
<text x="219" y="422" class="t" font-size="24" font-weight="800" fill="#2A2217">Approve the bill</text>
<text x="219" y="458" class="t" font-size="16" font-weight="600" fill="#6A5C44">Exact amount, saved account.</text>
<text x="219" y="482" class="t" font-size="16" font-weight="600" fill="#6A5C44">Voice can never approve</text>
<g filter="url(#s)"><rect x="499" y="330" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="499" y="330" width="8" height="190" rx="4" fill="#1E7656"/>
<text x="525" y="370" class="l" font-size="15" fill="#B3A47E">06</text>
<rect x="653.4" y="350" width="107.6" height="28" rx="14" fill="#1E7656"/>
<text x="707.2" y="369" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">CASHFREE</text>
<text x="525" y="422" class="t" font-size="24" font-weight="800" fill="#2A2217">Pay once</text>
<text x="525" y="458" class="t" font-size="16" font-weight="600" fill="#6A5C44">Secure ID checks the account,</text>
<text x="525" y="482" class="t" font-size="16" font-weight="600" fill="#6A5C44">Payouts V2 sends it</text>
<g filter="url(#s)"><rect x="805" y="330" width="280" height="190" rx="20" fill="url(#r)"/></g>
<rect x="805" y="330" width="8" height="190" rx="4" fill="#1E7656"/>
<text x="831" y="370" class="l" font-size="15" fill="#B3A47E">07</text>
<rect x="959.4" y="350" width="107.6" height="28" rx="14" fill="#1E7656"/>
<text x="1013.2" y="369" text-anchor="middle" class="l" font-size="12" fill="#FFF8E6">CASHFREE</text>
<text x="831" y="422" class="t" font-size="24" font-weight="800" fill="#2A2217">Real status, on record</text>
<text x="831" y="458" class="t" font-size="16" font-weight="600" fill="#6A5C44">Webhooks and status lookups.</text>
<text x="831" y="482" class="t" font-size="16" font-weight="600" fill="#6A5C44">Every step in the log</text>
