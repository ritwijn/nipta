<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="How a Friday works in Nipta, in seven steps">
<title>How a Friday works in Nipta</title>
<defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9F1DC"/><stop offset="1" stop-color="#E6D7B0"/></linearGradient>
