<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What never happens</title>
<desc id="dsc">Four guarantees: no payment without the owner's click; no money to a changed bank account; no second payout on retry; nothing marked paid without Cashfree's confirmation.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C261D"/><stop offset="1" stop-color="#221D16"/></linearGradient>
  <linearGradient id="sunk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1611"/><stop offset="1" stop-color="#28221A"/></linearGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8C66"/><stop offset="1" stop-color="#1E7656"/></linearGradient>
  <filter id="raise" x="-10%" y="-20%" width="120%" height="150%">
    <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#FFF0D2" flood-opacity="0.05"/>
    <feDropShadow dx="5" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
  <filter id="key" x="-10%" y="-30%" width="120%" height="170%">
    <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#FFF0D2" flood-opacity="0.05"/>
    <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.48"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<style>
text { font-family: Manrope, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Kannada', 'Noto Sans Devanagari', sans-serif; fill: #F4EBD2; }
.lbl { font-family: 'Chakra Petch', 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 0.14em; font-size: 10.5px; fill: #E2D2A9; }
.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
.muted { fill: #B3A47E; }
@keyframes tick0 { 0%, 8% { stroke-dashoffset: 30; } 14%, 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
.tick0 { stroke-dasharray: 30; animation: tick0 12s ease-out infinite; }
@keyframes tick1 { 0%, 18% { stroke-dashoffset: 30; } 24%, 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
.tick1 { stroke-dasharray: 30; animation: tick1 12s ease-out infinite; }
@keyframes tick2 { 0%, 28% { stroke-dashoffset: 30; } 34%, 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
.tick2 { stroke-dasharray: 30; animation: tick2 12s ease-out infinite; }
@keyframes tick3 { 0%, 38% { stroke-dashoffset: 30; } 44%, 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
.tick3 { stroke-dasharray: 30; animation: tick3 12s ease-out infinite; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .a { opacity: 1 !important; transform: none !important; }
  .gone { opacity: 0 !important; }
}
</style>
<rect width="880" height="268" rx="28" fill="#17140F"/>
<text x="32" y="44" class="lbl">WHAT NEVER HAPPENS</text>
<rect x="32" y="64" width="195" height="178" rx="20" fill="url(#card)" filter="url(#raise)"/><circle cx="62" cy="98" r="16" fill="url(#sunk)"/><path class="a tick0" d="M54 98 l6 6 l11 -12" fill="none" stroke="#3CCB8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="138" style="font-weight:800;font-size:13.5px">No payment</text><text x="50" y="155" style="font-weight:800;font-size:13.5px">without your click</text>
<text x="50" y="182" class="muted" style="font-size:11.5px;font-weight:600">Voice and chat only prepare.</text>
<text x="50" y="199" class="muted" style="font-size:11.5px;font-weight:600">Approval is bound to the exact</text>
<text x="50" y="216" class="muted" style="font-size:11.5px;font-weight:600">payee, amount and snapshot.</text>
<rect x="239" y="64" width="195" height="178" rx="20" fill="url(#card)" filter="url(#raise)"/><circle cx="269" cy="98" r="16" fill="url(#sunk)"/><path class="a tick1" d="M261 98 l6 6 l11 -12" fill="none" stroke="#3CCB8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="257" y="138" style="font-weight:800;font-size:13.5px">No money to a</text><text x="257" y="155" style="font-weight:800;font-size:13.5px">changed account</text>
<text x="257" y="182" class="muted" style="font-size:11.5px;font-weight:600">A new account on a bill blocks</text>
<text x="257" y="199" class="muted" style="font-size:11.5px;font-weight:600">it, even if the bank says the</text>
<text x="257" y="216" class="muted" style="font-size:11.5px;font-weight:600">account is valid.</text>
<rect x="446" y="64" width="195" height="178" rx="20" fill="url(#card)" filter="url(#raise)"/><circle cx="476" cy="98" r="16" fill="url(#sunk)"/><path class="a tick2" d="M468 98 l6 6 l11 -12" fill="none" stroke="#3CCB8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="138" style="font-weight:800;font-size:13.5px">No second payout</text><text x="464" y="155" style="font-weight:800;font-size:13.5px">on a retry</text>
<text x="464" y="182" class="muted" style="font-size:11.5px;font-weight:600">One attempt per approval, one</text>
<text x="464" y="199" class="muted" style="font-size:11.5px;font-weight:600">transfer ID. A timeout becomes</text>
<text x="464" y="216" class="muted" style="font-size:11.5px;font-weight:600">UNKNOWN, never a resend.</text>
<rect x="653" y="64" width="195" height="178" rx="20" fill="url(#card)" filter="url(#raise)"/><circle cx="683" cy="98" r="16" fill="url(#sunk)"/><path class="a tick3" d="M675 98 l6 6 l11 -12" fill="none" stroke="#3CCB8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="671" y="138" style="font-weight:800;font-size:13.5px">Nothing “paid”</text><text x="671" y="155" style="font-weight:800;font-size:13.5px">without Cashfree</text>
<text x="671" y="182" class="muted" style="font-size:11.5px;font-weight:600">Settled only on COMPLETED.</text>
<text x="671" y="199" class="muted" style="font-size:11.5px;font-weight:600">A reversal adds a correcting</text>
<text x="671" y="216" class="muted" style="font-size:11.5px;font-weight:600">entry; history stays.</text>
</svg>
