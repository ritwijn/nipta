<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Six checks</title>
<desc id="dsc">Six checks on invoice EH-040 from Eastern Hardware for ₹6,000: adds up, words match, not twice, known vendor and name confirmed pass; same bank account holds because the bill asks for an account ending 6655 while the saved one ends 1234. Verdict: don't pay this bill.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C261D"/><stop offset="1" stop-color="#221D16"/></linearGradient>
  <linearGradient id="sunk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1611"/><stop offset="1" stop-color="#28221A"/></linearGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8C66"/><stop offset="1" stop-color="#1E7656"/></linearGradient>
  <filter id="raise" x="-10%" y="-20%" width="120%" height="150%">
    <feDropShadow dx="-4" dy="-4" stdDeviation="5" flood-color="#FFF0D2" flood-opacity="0.05"/>
    <feDropShadow dx="5" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
  <filter id="key" x="-10%" y="-30%" width="120%" height="170%">
    <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#FFF0D2" flood-opacity="0.05"/>
    <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.48"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<style>
text { font-family: Manrope, 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans Kannada', 'Noto Sans Devanagari', sans-serif; fill: #F4EBD2; }
.lbl { font-family: 'Chakra Petch', 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 0.14em; font-size: 10.5px; fill: #E2D2A9; }
.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
.muted { fill: #B3A47E; }
@keyframes c0 { 0%, 6.0% { opacity: 0; } 9.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c0 { animation: c0 12s ease-out infinite; }
@keyframes w0 { 0%, 1.0% { opacity: 0; } 4.0%, 5.0% { opacity: 1; } 7.0%, 100% { opacity: 0; } }
.w0 { animation: w0 12s ease-out infinite; }
@keyframes c1 { 0%, 13.0% { opacity: 0; } 16.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c1 { animation: c1 12s ease-out infinite; }
@keyframes w1 { 0%, 1.0% { opacity: 0; } 4.0%, 12.0% { opacity: 1; } 14.0%, 100% { opacity: 0; } }
.w1 { animation: w1 12s ease-out infinite; }
@keyframes c2 { 0%, 20.0% { opacity: 0; } 23.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c2 { animation: c2 12s ease-out infinite; }
@keyframes w2 { 0%, 1.0% { opacity: 0; } 4.0%, 19.0% { opacity: 1; } 21.0%, 100% { opacity: 0; } }
.w2 { animation: w2 12s ease-out infinite; }
@keyframes c3 { 0%, 27.0% { opacity: 0; } 30.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c3 { animation: c3 12s ease-out infinite; }
@keyframes w3 { 0%, 1.0% { opacity: 0; } 4.0%, 26.0% { opacity: 1; } 28.0%, 100% { opacity: 0; } }
.w3 { animation: w3 12s ease-out infinite; }
@keyframes c4 { 0%, 34.0% { opacity: 0; } 37.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c4 { animation: c4 12s ease-out infinite; }
@keyframes w4 { 0%, 1.0% { opacity: 0; } 4.0%, 33.0% { opacity: 1; } 35.0%, 100% { opacity: 0; } }
.w4 { animation: w4 12s ease-out infinite; }
@keyframes holdbg { 0%, 34.0% { opacity: 0; } 37.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.holdbg { animation: holdbg 12s ease-out infinite; }
@keyframes c5 { 0%, 41.0% { opacity: 0; } 44.0%, 95.0% { opacity: 1; } 97.0%, 100% { opacity: 0; } }
.c5 { animation: c5 12s ease-out infinite; }
@keyframes w5 { 0%, 1.0% { opacity: 0; } 4.0%, 40.0% { opacity: 1; } 42.0%, 100% { opacity: 0; } }
.w5 { animation: w5 12s ease-out infinite; }
@keyframes verdict { 0%, 52.0% { opacity: 0; transform: translate(0px, 8px); } 55.0%, 95.0% { opacity: 1; transform: none; } 97.0%, 100% { opacity: 0; } }
.verdict { animation: verdict 12s ease-out infinite; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .a { opacity: 1 !important; transform: none !important; }
  .gone { opacity: 0 !important; }
}
</style>
<rect width="880" height="400" rx="28" fill="#17140F"/>
<text x="32" y="44" class="lbl">EVERY BILL, SIX CHECKS</text><text x="32" y="74" style="font-weight:800;font-size:22px;letter-spacing:-.5px">Eastern Hardware · EH-040 · ₹6,000</text>
<rect x="32" y="96" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/>
<text x="50" y="126" style="font-weight:800;font-size:14.5px">Adds up</text>
<g class="a w0 gone"><g class=""><rect x="196" y="110" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="208" cy="121" r="3.5" fill="#5E533F"/><text x="217" y="125" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c0"><g class=""><rect x="220" y="110" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="232" cy="121" r="3.5" fill="#3CCB8E"/><text x="241" y="125" class="lbl" style="fill:#5BE0A6;font-size:10px;letter-spacing:.08em">PASS</text></g><text x="50" y="158" class="muted" style="font-size:12px;font-weight:600">Lines add up to ₹6,000. Stated ₹6,000.</text></g>
<rect x="310" y="96" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/>
<text x="328" y="126" style="font-weight:800;font-size:14.5px">Words match</text>
<g class="a w1 gone"><g class=""><rect x="474" y="110" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="486" cy="121" r="3.5" fill="#5E533F"/><text x="495" y="125" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c1"><g class=""><rect x="498" y="110" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="510" cy="121" r="3.5" fill="#3CCB8E"/><text x="519" y="125" class="lbl" style="fill:#5BE0A6;font-size:10px;letter-spacing:.08em">PASS</text></g><text x="328" y="158" class="muted" style="font-size:12px;font-weight:600">“Six Thousand” = ₹6,000.</text></g>
<rect x="588" y="96" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/>
<text x="606" y="126" style="font-weight:800;font-size:14.5px">Not twice</text>
<g class="a w2 gone"><g class=""><rect x="752" y="110" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="764" cy="121" r="3.5" fill="#5E533F"/><text x="773" y="125" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c2"><g class=""><rect x="776" y="110" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="788" cy="121" r="3.5" fill="#3CCB8E"/><text x="797" y="125" class="lbl" style="fill:#5BE0A6;font-size:10px;letter-spacing:.08em">PASS</text></g><text x="606" y="158" class="muted" style="font-size:12px;font-weight:600">No earlier bill like this one.</text></g>
<rect x="32" y="204" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/>
<text x="50" y="234" style="font-weight:800;font-size:14.5px">Known vendor</text>
<g class="a w3 gone"><g class=""><rect x="196" y="218" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="208" cy="229" r="3.5" fill="#5E533F"/><text x="217" y="233" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c3"><g class=""><rect x="220" y="218" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="232" cy="229" r="3.5" fill="#3CCB8E"/><text x="241" y="233" class="lbl" style="fill:#5BE0A6;font-size:10px;letter-spacing:.08em">PASS</text></g><text x="50" y="266" class="muted" style="font-size:12px;font-weight:600">Eastern Hardware is approved.</text></g>
<rect x="310" y="204" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/><g class="a holdbg"><rect x="310" y="204" width="260" height="92" rx="18" fill="url(#sunk)"/><rect x="311" y="205" width="258" height="90" rx="17" fill="none" stroke="#F0644A" stroke-width="2"/></g>
<text x="328" y="234" style="font-weight:800;font-size:14.5px">Same bank account</text>
<g class="a w4 gone"><g class=""><rect x="474" y="218" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="486" cy="229" r="3.5" fill="#5E533F"/><text x="495" y="233" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c4"><g class=""><rect x="498" y="218" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="510" cy="229" r="3.5" fill="#F0644A"/><text x="519" y="233" class="lbl" style="fill:#FF8A72;font-size:10px;letter-spacing:.08em">HOLD</text></g><text x="328" y="266" class="muted" style="font-size:12px;font-weight:600">Bill: ••6655 · saved: ••1234.</text></g>
<rect x="588" y="204" width="260" height="92" rx="18" fill="url(#card)" filter="url(#key)"/>
<text x="606" y="234" style="font-weight:800;font-size:14.5px">Name confirmed</text>
<g class="a w5 gone"><g class=""><rect x="752" y="218" width="82" height="22" rx="11" fill="url(#sunk)"/><circle cx="764" cy="229" r="3.5" fill="#5E533F"/><text x="773" y="233" class="lbl" style="fill:#B3A47E;font-size:10px;letter-spacing:.08em">CHECKING</text></g></g>
<g class="a c5"><g class=""><rect x="776" y="218" width="58" height="22" rx="11" fill="url(#sunk)"/><circle cx="788" cy="229" r="3.5" fill="#3CCB8E"/><text x="797" y="233" class="lbl" style="fill:#5BE0A6;font-size:10px;letter-spacing:.08em">PASS</text></g><text x="606" y="266" class="muted" style="font-size:12px;font-weight:600">Account holder matches the vendor.</text></g>
<g class="a verdict"><rect x="32" y="310" width="816" height="64" rx="20" fill="url(#sunk)"/><text x="54" y="340" style="font-weight:800;font-size:20px;fill:#FF8A72">Don't pay this bill.</text><text x="54" y="360" class="muted" style="font-size:12.5px;font-weight:600">The account on the bill isn't the one you approved. No override: a new account is added only by you, in Vendors.</text></g>
</svg>
