<title id="ttl">Nipta</title>
<desc id="dsc">Nipta reads three bills (Coimbatore Packing in Kannada, Kaveri Fasteners in Hindi, Eastern Hardware in English), runs six checks on each, marks the first safe to pay, the second a possible copy and the third blocked for a changed bank account, then pays ₹3,200 once through the Cashfree sandbox after the owner approves.</desc>
